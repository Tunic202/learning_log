applications:
  ll_project:
    type: "python:3.10"

    relationships:
      database:
        service: db
        endpoint: postgresql

    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_remote.txt
        python manage.py collectstatic --noinput

      deploy: |
        python manage.py migrate

    web:
      upstream:
        socket_family: unix

      commands:
        start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"

      locations:
        "/":
          passthru: true

        "/static":
          root: "static"
          expires: 1h
          allow: true

    mounts:
      "logs":
        source: storage
        source_path: logs

services:
  db:
    type: "postgresql:16"

routes:
  "https://{default}/":
    type: upstream
    upstream: "ll_project:http"

  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
